name: Actualizador Diario Futbol Fantasy

on:
  schedule:
    - cron: '0 4 * * *' # Se ejecuta diariamente a las 04:00 AM UTC
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

jobs:
  scraping:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v3

      - name: Instalar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar Scraper
        run: python scraper.py

      - name: Commit y Guardar CSV
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add historico_fantasy.csv
          git commit -m "Actualización diaria Fútbol Fantasy" || echo "Sin cambios que guardar"
          git push
